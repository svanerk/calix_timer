<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bakken Trekker</title><link rel="stylesheet" href="style.css"></head><body>
<main class="app">
<section id="home" class="screen"><header><div><small>BAKKEN TREKKER</small><h1>Wie trekt er?</h1></div><button id="scores">🏆</button></header><div id="people" class="people"></div><div id="status">Verbinden…</div></section>
<section id="timerScreen" class="screen hidden"><header><button id="back">←</button><div><small>AAN DE BEURT</small><h1 id="personName"></h1></div></header><div class="timerArea"><div id="timer">00:00.00</div><button id="timerBtn" class="start">START</button><p id="hint">Druk op START om te beginnen.</p></div></section>
<section id="result" class="screen hidden"><div class="card"><small>METING KLAAR</small><h1 id="resultName"></h1><div id="resultTime">00:00.00</div><p>Wil je deze meting bewaren?</p><div class="actions"><button id="discard">Weggooien</button><button id="save">Opslaan</button></div></div></section>
<section id="scoreScreen" class="screen hidden"><header><button id="scoreBack">←</button><div><small>RESULTATEN</small><h1>Scorebord</h1></div></header><div id="scoreboard"></div></section>
</main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="script.js"></script></body></html>
